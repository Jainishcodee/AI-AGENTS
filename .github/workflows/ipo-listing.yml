# Listing-morning watcher, running on GitHub's machines rather than yours.
#
# Starts before the 10:00 IST open, checks whether anything actually lists
# today, and exits in seconds if not. On the ~15 days a year something does
# list, it tracks live prices and pushes buy / target / stop alerts to your
# phone until midday.
#
# Requires Angel One credentials as encrypted repository secrets.

name: IPO listing watch

on:
  schedule:
    # 03:17 UTC = 08:47 IST, about seventy minutes before the 10:00 listing.
    #
    # Two deliberate choices, both learned the hard way.
    #
    # NOT ON THE HOUR. `0 4` sat in the most congested slot GitHub has: almost
    # everyone schedules at :00, and the schedule event is explicitly
    # best-effort. The calendar job was moved to :07 and :37 and began arriving
    # on time; this one stayed at :00 and kept landing around 14:00 -- hours
    # after the listing it exists to watch. Same repository, same runner pool,
    # different minute.
    #
    # EARLY ENOUGH TO ABSORB THE LAG. Being early costs idle polling. Being
    # late costs the opening print, which cannot be recovered afterwards. The
    # watcher exits by itself at session_end, so starting early does not bill
    # through to the close.
    #
    # FIVE DRAWS, NOT ONE. Moving off the hour was not enough on its own: a run
    # scheduled for 08:47 IST started at 14:20, five and a half hours late,
    # long after the listing. The calendar job is not immune to that either --
    # it survives because it has five chances a day and only needs one to land
    # early. This had exactly one, so a single bad draw lost the whole morning.
    #
    # `cancel-in-progress: false` bounds the cost: GitHub keeps at most one run
    # going plus one pending, and cancels older pending runs, so extra crons buy
    # attempts rather than parallel jobs.
    - cron: "47 1 * * 1-5"    # 07:17 IST
    - cron: "17 2 * * 1-5"    # 07:47 IST
    - cron: "47 2 * * 1-5"    # 08:17 IST
    - cron: "17 3 * * 1-5"    # 08:47 IST
    - cron: "47 3 * * 1-5"    # 09:17 IST — last useful draw before the open
  workflow_dispatch:
    inputs:
      capital:
        description: "Capital for position sizing (Rs)"
        default: "40000"

concurrency:
  group: ipo-listing
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # From an 08:47 start this reaches about 10:47 IST, covering the arm, the
    # opening print and the first quarter-hour of trading -- which is the part
    # that matters, since the measured edge is the allotment, not buying into a
    # listing.
    #
    # 120 rather than 160 because the allowance is finite and silent when
    # exhausted. A private repository gets 2,000 free Actions minutes a month;
    # August 2026 had 12 mainboard listing days, which at 160 minutes would have
    # been 1,920 minutes from this workflow alone. Running out does not fail a
    # run, it stops scheduling entirely, with no error anywhere.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: stockseer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the push secret is present
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::NTFY_TOPIC is not set. Alerts will reach nobody."
            exit 1
          fi
          echo "NTFY_TOPIC is set (${#NTFY_TOPIC} characters)"

      - name: Is anything listing today?
        id: check
        env:
          TZ: Asia/Kolkata
        # Pure standard library, so this costs no install time on the ~350
        # days a year when the answer is "nothing".
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from stockseer.ipo.registry import listing_today
          ipos = listing_today()
          print(f"count={len(ipos)}")
          print(f"symbols={','.join(i.symbol for i in ipos)}")
          PY

      - name: Nothing lists today
        if: steps.check.outputs.count == '0'
        run: echo "No IPO lists today. Exiting."

      - name: Install the market feed
        if: steps.check.outputs.count != '0'
        # websocket-client is NOT optional, despite smartapi-python not asking
        # for it. Version 1.5.5 declares only requests, six and python-dateutil,
        # then imports `websocket` at runtime -- an undeclared dependency, i.e. a
        # packaging bug upstream. A developer machine hides it, because almost
        # anything else pulls websocket-client in; a clean runner does not.
        #
        # The cost of the omission was total and silent. Every Angel call raised
        # ModuleNotFoundError, the feed fell back to Yahoo, and the watcher spent
        # listing morning acting on FIFTEEN-MINUTE-DELAYED prices. On the one
        # instrument where the first fifteen minutes are the entire event, that
        # is not degraded data, it is the wrong data.
        run: |
          pip install --quiet pandas numpy smartapi-python pyotp logzero \
                              websocket-client
          python - <<'PY'
          # Fail loudly here rather than degrading to delayed prices later.
          #
          # `import importlib` alone does not bind importlib.util -- it is a
          # submodule and needs importing by name, or find_spec raises
          # AttributeError and this guard fails instead of the thing it guards.
          import importlib.util
          import sys

          missing = [m for m in ("websocket", "pyotp", "SmartApi", "pandas")
                     if importlib.util.find_spec(m) is None]
          if missing:
              sys.exit(f"::error::market feed incomplete, missing: {missing}")
          print("market feed dependencies present")
          PY

      - name: Watch the listing
        if: steps.check.outputs.count != '0'
        env:
          TZ: Asia/Kolkata
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          echo "Listing today: ${{ steps.check.outputs.symbols }}"
          python -m stockseer.cli ipo autorun \
            --capital "${{ github.event.inputs.capital || '40000' }}"

      - name: Report a failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python - <<'PY'
          from stockseer.push import push
          push("StockSeer watcher failed",
               "The listing watcher errored. If you were waiting on a buy or "
               "stop alert, it is NOT coming — check any position manually.",
               urgency="critical", kind="test")
          PY
