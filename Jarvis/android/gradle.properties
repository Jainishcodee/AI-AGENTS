# Sized for this machine, not for a build server. 15.8 GB of RAM and a 32 GB commit
# limit shared with Windows, VS Code and a browser: -Xmx8G with -XX:MaxMetaspaceSize=4G
# asked one JVM to reserve up to 12.5 GB, and G1 died mmapping 1.5 GB of heap space with
# roughly 4 GB of commit headroom left. The failure reads as "daemon disappeared", which
# points nowhere near the actual problem.
#
# 3 GB heap is comfortable for a Flutter release build including R8. Metaspace for a
# Gradle build of this size settles well under 512 MB; 1 GB is headroom, not a target.
#
# ASCII only in this file on purpose: .properties is read as ISO-8859-1 by the Java
# spec, so anything else here is a silent mojibake trap.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# 16 cores would otherwise let Gradle fan out workers that each want their own JVM, and
# the commit limit - not the core count - is the binding constraint here.
org.gradle.workers.max=4

android.useAndroidX=true

# Project is on G:\ but Flutter pub cache is on C:\ - Kotlin's incremental compiler
# crashes computing relative paths across drives. Turn it off.
kotlin.incremental=false
