name: jarvis
description: "Voice-activated personal assistant with animated Claude-mascot."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1
  android_intent_plus: ^5.2.0
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/deck.json
    # Populated by reelflow/media.py; cards without a cover just render without one.
    - assets/thumbs/
